name: Free Access Release Gate
on:
  pull_request:
    paths:
      - 'index.html'
      - 'qa/navigation-links.cjs'
      - '.github/workflows/free-access-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock linkedom@0.18.12
      - name: Existing navigation functional tests
        run: node qa/navigation-links.cjs
      - name: Verify marketing popup removed and one-time purchases preserved
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('index.html','utf8');
          assert(s.includes('function canShowFounderPopup(){return false;'),'Automatic email popup must be disabled');
          assert(s.includes('#foundingForm,#founderPopupForm{display:none!important}'),'Marketing email forms must be hidden');
          assert(s.includes('buy.stripe.com/14A6oI2bU3Tt11z1Gf7Re07'),'Founding purchase link must be preserved');
          assert(s.includes('buy.stripe.com/eVqeVeaIq4XxcKhet17Re06'),'Lifetime purchase link must be preserved');
          assert(/\$49[^\n]*one.time/i.test(s)||s.includes('One-time payment'),'Founding must remain one-time');
          console.log('Preserved one-time product links; promotional email capture disabled');
          JS
